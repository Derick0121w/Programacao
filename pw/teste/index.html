<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo da Velha</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #f0f0f0;
            text-align: center;
            padding: 30px;
        }

        h1 {
            margin-bottom: 20px;
            color: #333;
        }

        #placar {
            font-size: 20px;
            margin-bottom: 20px;
            color: #444;
        }

        .tabuleiro {
            display: grid;
            grid-template-columns: repeat(3, 100px);
            gap: 10px;
            justify-content: center;
            margin-bottom: 20px;
        }

        .celula {
            width: 100px;
            height: 100px;
            background-color: white;
            border: 2px solid #333;
            font-size: 50px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .celula:hover {
            background-color: #e0e0e0;
        }

        .botoes button {
            margin: 0 10px;
            padding: 10px 20px;
            cursor: pointer;
            background-color: #333;
            color: white;
            border: none;
            border-radius: 5px;
            transition: background-color 0.3s;
        }

        .botoes button:hover {
            background-color: #555;
        }
    </style>
</head>
<body>
    <h1>Jogo da Velha</h1>

    <div id="placar">X: 0 | O: 0</div>

    <div class="tabuleiro">
        <button class="celula"></button>
        <button class="celula"></button>
        <button class="celula"></button>
        <button class="celula"></button>
        <button class="celula"></button>
        <button class="celula"></button>
        <button class="celula"></button>
        <button class="celula"></button>
        <button class="celula"></button>
    </div>

    <div class="botoes">
        <button id="reiniciar">Reiniciar</button>
        <button id="zerar">Zerar Placar</button>
    </div>

    <script>
        const celulas = document.querySelectorAll('.celula');
        const placar = document.getElementById('placar');
        const reiniciar = document.getElementById('reiniciar');
        const zerar = document.getElementById('zerar');

        const winConditions = [
            [0,1,2], [3,4,5], [6,7,8], // linhas
            [0,3,6], [1,4,7], [2,5,8], // colunas
            [0,4,8], [2,4,6]           // diagonais
        ];

        let board = ["", "", "", "", "", "", "", "", ""];
        let jogadorAtual = "X";
        let pontos = { X: 0, O: 0 };
        let jogoAtivo = true;

        function checarVitoria() {
            for (const condition of winConditions) {
                const [a, b, c] = condition;
                if (
                    board[a] && 
                    board[a] === board[b] && 
                    board[a] === board[c]
                ) {
                    jogoAtivo = false;
                    pontos[board[a]] += 1;
                    atualizarPlacar();
                    setTimeout(() => {
                        alert(`Jogador ${board[a]} venceu!`);
                    }, 100);
                    return;
                }
            }

            if (!board.includes("")) {
                jogoAtivo = false;
                setTimeout(() => {
                    alert("Empate!");
                }, 100);
            }
        }

        function atualizarPlacar() {
            placar.innerText = `X: ${pontos.X} | O: ${pontos.O}`;
        }

        function handleClick(index) {
            if (board[index] !== "" || !jogoAtivo) return;

            board[index] = jogadorAtual;
            celulas[index].innerText = jogadorAtual;

            checarVitoria();

            jogadorAtual = jogadorAtual === "X" ? "O" : "X";
        }

        celulas.forEach((celula, index) => {
            celula.addEventListener('click', () => handleClick(index));
        });

        reiniciar.addEventListener('click', () => {
            board = ["", "", "", "", "", "", "", "", ""];
            celulas.forEach(celula => celula.innerText = "");
            jogadorAtual = "X";
            jogoAtivo = true;
        });

        zerar.addEventListener('click', () => {
            pontos = { X: 0, O: 0 };
            atualizarPlacar();
            board = ["", "", "", "", "", "", "", "", ""];
            celulas.forEach(celula => celula.innerText = "");
            jogadorAtual = "X";
            jogoAtivo = true;
        });
    </script>
</body>
</html>

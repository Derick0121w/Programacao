<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galeria de Imagens Simples</title>
    <style>
        /* Estilos CSS */
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
            font-family: sans-serif;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 600px;
            padding: 20px;
            background-color: #fff;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            border-radius: 8px;
        }

        .gallery {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        #mainImage {
            width: 500px;
            height: 350px;
            object-fit: cover;
            border: 2px solid #333;
            border-radius: 8px;
        }

        .nav-btn {
            background-color: #ccc;
            color: #333;
            border: 1px solid #aaa;
            padding: 10px;
            font-size: 24px;
            cursor: pointer;
            width: 40px;
            height: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 5px;
        }

        .nav-btn:hover {
            background-color: #ddd;
        }

        .indicators {
            display: flex;
            justify-content: center;
            gap: 10px;
        }

        .indicator {
            width: 15px;
            height: 15px;
            background-color: #bbb;
            border-radius: 50%;
            cursor: pointer;
        }

        .indicator.active {
            background-color: #333;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="gallery">
            <button id="prevBtn" class="nav-btn">&lt;</button>
            <img id="mainImage" src="" alt="Imagem da galeria">
            <button id="nextBtn" class="nav-btn">&gt;</button>
        </div>
        <div class="indicators" id="indicators">
            </div>
    </div>

    <script>
        // Lógica JavaScript
        const images = [
            'https://via.placeholder.com/600x400/FF5733/FFFFFF?text=Imagem+1',
            'https://via.placeholder.com/600x400/33FF57/FFFFFF?text=Imagem+2',
            'https://via.placeholder.com/600x400/3357FF/FFFFFF?text=Imagem+3',
            'https://via.placeholder.com/600x400/F0FF33/000000?text=Imagem+4',
            'https://via.placeholder.com/600x400/5733FF/FFFFFF?text=Imagem+5'
        ];

        let currentIndex = 0;

        const mainImage = document.getElementById('mainImage');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const indicatorsContainer = document.getElementById('indicators');

        function updateGallery() {
            mainImage.src = images[currentIndex];

            const allIndicators = document.querySelectorAll('.indicator');
            allIndicators.forEach(indicator => indicator.classList.remove('active'));

            const currentIndicator = document.getElementById(`indicator-${currentIndex}`);
            if (currentIndicator) {
                currentIndicator.classList.add('active');
            }
        }

        prevBtn.addEventListener('click', () => {
            currentIndex = (currentIndex > 0) ? currentIndex - 1 : images.length - 1;
            updateGallery();
        });

        nextBtn.addEventListener('click', () => {
            currentIndex = (currentIndex < images.length - 1) ? currentIndex + 1 : 0;
            updateGallery();
        });

        images.forEach((_, index) => {
            const indicator = document.createElement('div');
            indicator.classList.add('indicator');
            indicator.id = `indicator-${index}`;
            indicatorsContainer.appendChild(indicator);

            indicator.addEventListener('click', () => {
                currentIndex = index;
                updateGallery();
            });
        });

        updateGallery();
    </script>
</body>
</html>

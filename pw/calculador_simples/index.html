<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="painel"></div>
    <div id="resto">
        <div id="numeros">
            <div class="num">0</div>
            <div class="num">1</div>
            <div class="num">2</div>
            <div class="num">3</div>
            <div class="num">4</div>
            <div class="num">5</div>
            <div class="num">6</div>
            <div class="num">7</div>
            <div class="num">8</div>
            <div class="num">9</div>
        </div>
        <div id="operacoes">
        <button id="mais">+</button>
        <button id="menos">-</button>
        <button id="vezes">*</button>
        <button id="divisao">/</button>
        <button id="igual">=</button>
        </div>
    </div>
    <script src="scripts.js"></script>
</body>
</html>
